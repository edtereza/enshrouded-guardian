[package]
name = "enshrouded-server-guardian"
version = "3.0.9"
edition = "2021"

[lib]
name = "dbghelp"
crate-type = ["cdylib"]

[features]
shroudtopia = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dependencies]
ruzstd = "0.9.1"
serde_json = "1"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
] }

[profile.release]
panic = "abort"
opt-level = 2
debug = false
