<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Guardian · Explorador of saves</title>
<link rel="stylesheet" href="__GUARDIAN_ASSET_BASE__/viewer.css">
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><strong>▰ &nbsp; GUARDIAN</strong><p>SERVER DATA</p></div>
  <div class="account"><small>Steam account</small><div id="steam-id" class="mono">—</div></div>
  <nav class="navigation" aria-label="Save data" id="navigation">
    <button data-view="equipment">♜ &nbsp; Character <span class="nav-count" data-count="equipment"></span></button>
    <button data-view="inventory" aria-current="page">◈ &nbsp; Backpack <span class="nav-count" data-count="inventory"></span></button>
    <button data-view="skills">ϟ &nbsp; Skills <span class="nav-count" data-count="skills"></span></button>
    <button data-view="knowledge">⬆ &nbsp; Knowledge <span class="nav-count" data-count="knowledge"></span></button>
  </nav>
</aside>
<main id="drop-zone">
  <header class="topbar"><div><span id="breadcrumb"></span></div></header>
  <div id="file-error" class="error" role="alert" hidden></div>
  <div class="intro"><div><div class="eyebrow" id="source-label">Client input</div><h1>Character data</h1><p id="report-description"></p></div><span class="status" id="status"></span></div>
  <dl class="metrics">
    <div class="metric"><dt>Level</dt><dd id="level">—</dd></div>
    <div class="metric"><dt>XP towards next level</dt><dd id="xp">—</dd></div>
    <div class="metric"><dt>Used skill points</dt><dd id="points">—</dd></div>
    <div class="metric"><dt>Knowledge</dt><dd id="known">—</dd></div>
  </dl>
  <section aria-label="Character content">
    <div class="sectionbar"><div><h2 id="section-title">Inventories</h2><p id="section-subtitle"></p></div><input type="search" id="search" class="search" placeholder="Search name or ID…" aria-label="Search displayed data"></div>
    <div id="content"></div>
  </section>
  <footer class="metadata" id="metadata"></footer>
</main>
</div>
<script id="guardian-data" type="application/json">{"reports":[]}</script>
<script src="__GUARDIAN_ASSET_BASE__/catalogs.js"></script>
<script src="__GUARDIAN_ASSET_BASE__/viewer.js"></script>
</body>
</html>
